<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marshal Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Marshal</p>
          <h1>Menu Bar Console</h1>
        </div>
        <div class="topbar-actions">
          <button id="open-chatgpt-button" class="ghost-button">ChatGPT / Bridge</button>
          <button id="open-operator-web-button" class="ghost-button">Web Console</button>
          <button id="restart-backend-button" class="ghost-button">Restart Backend</button>
          <button id="restart-app-button" class="ghost-button">Restart</button>
        </div>
      </header>

      <section class="health-strip">
        <div class="health-card">
          <span class="label">Projects</span>
          <strong id="health-projects">0</strong>
        </div>
        <div class="health-card">
          <span class="label">Sessions</span>
          <strong id="health-sessions">0</strong>
        </div>
        <div class="health-card accent">
          <span class="label">Running</span>
          <strong id="health-running">0</strong>
        </div>
        <div class="health-card accent">
          <span class="label">Queued</span>
          <strong id="health-queued">0</strong>
        </div>
        <div class="health-card">
          <span class="label">Backend</span>
          <strong id="health-backend">Booting</strong>
        </div>
      </section>

      <section class="toolbar">
        <label class="field">
          <span>Project</span>
          <select id="project-select"></select>
        </label>
        <div class="toolbar-buttons">
          <button id="new-project-button" class="ghost-button">New Project</button>
          <button id="new-session-button" class="primary-button">New Session</button>
        </div>
      </section>

      <section class="content-grid">
        <aside class="sessions-panel">
          <div class="panel-heading">
            <p class="eyebrow">Sessions</p>
            <button id="refresh-button" class="ghost-button slim-button">Refresh</button>
          </div>
          <div id="session-list" class="session-list"></div>
        </aside>

        <main class="detail-panel">
          <div class="detail-header">
            <div>
              <p class="eyebrow">Session</p>
              <h2 id="session-title">No session selected</h2>
            </div>
            <div class="detail-actions">
              <button id="open-workspace-button" class="ghost-button slim-button">Open Workspace</button>
              <button id="toggle-events-button" class="ghost-button slim-button">Show Log</button>
            </div>
          </div>

          <section id="messages" class="messages"></section>
          <section id="task-events" class="task-events hidden"></section>

          <form id="composer" class="composer">
            <label class="field">
              <span>Task</span>
              <textarea id="task-input" rows="4" placeholder="Describe what Marshal should do."></textarea>
            </label>
            <div class="composer-controls">
              <label class="field compact-field">
                <span>Route</span>
                <select id="route-select">
                  <option value="auto">Auto</option>
                  <option value="local">Local only</option>
                  <option value="browser">Browser only</option>
                </select>
              </label>
              <label class="field compact-field">
                <span>Attachments</span>
                <input id="file-input" type="file" multiple />
              </label>
            </div>
            <div id="attachment-list" class="attachment-list"></div>
            <div class="composer-footer">
              <p id="status-message" class="status-message">Desktop shell connected.</p>
              <button id="send-button" type="submit" class="primary-button">Run Task</button>
            </div>
          </form>
        </main>
      </section>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
