<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marshal AI</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-row">
      <div id="providerLabel">Claude (via desktop subscription)</div>
      <button id="resetBtn" title="Reset conversation">&#x21BB;</button>
    </div>

    <div class="toolbar-row capture-row">
      <button id="captureTextBtn" class="capture-btn" title="Click an element on the page, grab its visible text">📍 Pick text</button>
      <button id="captureHtmlBtn" class="capture-btn" title="Click an element on the page, grab its HTML">📍 Pick HTML</button>
      <button id="cancelPickerBtn" class="capture-btn cancel-btn" hidden>Cancel picker</button>
    </div>

    <div id="statusText" role="status"></div>
  </header>

  <main id="chatArea">
    <div id="messageList"></div>

    <div id="contextChip" class="context-chip" hidden>
      <span class="context-label">Context attached</span>
      <span id="contextPreview"></span>
      <button id="clearContextBtn" title="Clear attached context">×</button>
    </div>

    <div class="composer">
      <textarea id="promptInput" rows="3" placeholder="Ask Claude about the current page, or anything else… (Shift+Enter = newline)"></textarea>
      <div class="composer-actions">
        <button id="sendBtn" class="action-btn primary">Ask Claude</button>
        <button id="stopBtn" class="action-btn stop" hidden>Stop</button>
      </div>
    </div>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
