<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <link rel="stylesheet" href="./design-tokens.css" />
    <script src="./theme.js"></script>
    <script src="./locales.js"></script>
    <script src="./i18n.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: var(--font-sans);
      }
      /* Lumen indicator (#399): hairline card, mono uppercase readouts, the
         state colour only on the marker and the label. */
      .pill {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 0 var(--space-2) 0 var(--space-3);
        border-radius: var(--radius-card, var(--radius-lg));
        border: 1px solid var(--border-hairline, var(--border-default));
        border-left: 2px solid var(--marker);
        background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--shadow-md);
        color: var(--text-strong);
      }
      #label {
        flex: 1;
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        font-weight: var(--fw-medium);
        letter-spacing: var(--label-tracking, var(--letter-wider));
        text-transform: uppercase;
        color: var(--marker);
      }
      #time {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: var(--fs-xs);
        letter-spacing: var(--label-tracking, var(--letter-wider));
        color: var(--text-muted);
      }
      button {
        width: 26px;
        height: 26px;
        border: 1px solid var(--border-hairline, var(--border-default));
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        color: var(--text-default);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      }
      button:hover { background: var(--bg-hover); }
      button:active { transform: scale(0.94); }
      button.stop {
        border-color: transparent;
        background: var(--chip-bad-bg, var(--danger-soft));
      }
      button.stop:hover { background: color-mix(in srgb, var(--state-fail) 28%, transparent); }
      .square { background: var(--state-fail); width: 9px; height: 9px; border-radius: 1px; }
      .pill { --marker: var(--state-listen); }
      .wave {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
        color: var(--state-listen);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.88); }
      }
      @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
    </style>
  </head>
  <body>
    <div class="pill">
      <svg class="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12h3l2.5-7 5 14 3-7H22" />
      </svg>
      <span id="label" data-i18n="indicator.meeting">Meeting…</span>
      <span id="time">00:00</span>
      <button class="stop" id="stop" title="Stop meeting recording" aria-label="Stop meeting recording" data-i18n-title="indicator.stopMeeting" data-i18n-aria-label="indicator.stopMeeting"><span class="square"></span></button>
    </div>
    <script type="module">
      const api = window.marshalMeeting;
      const timeEl = document.getElementById("time");
      const stopBtn = document.getElementById("stop");

      let seconds = 0;
      const interval = setInterval(() => {
        seconds += 1;
        const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
        const ss = String(seconds % 60).padStart(2, "0");
        timeEl.textContent = `${mm}:${ss}`;
      }, 1000);

      stopBtn.addEventListener("click", () => {
        clearInterval(interval);
        if (api && typeof api.stop === "function") {
          api.stop();
        }
      });
    </script>
  </body>
</html>
