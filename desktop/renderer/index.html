<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marshal</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-theme="light">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Marshal</span>
        <div class="sidebar-actions">
          <button id="clear-all-btn" class="sidebar-btn" title="Clear all chats">&#128465;</button>
          <button id="new-chat-btn" class="sidebar-btn primary" title="New chat">+ New</button>
        </div>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <main class="chat-main">
      <header class="chat-header">
        <button id="menu-btn" class="icon-btn">&#9776;</button>
        <button id="dir-picker" class="dir-picker">
          <span class="dir-icon">&#128193;</span>
          <span id="dir-label">~/</span>
          <span class="dir-arrow">&#9662;</span>
        </button>
        <div id="dir-dropdown" class="dir-dropdown hidden">
          <!-- Recent dirs populated by JS -->
        </div>
        <div class="header-spacer"></div>
        <button id="theme-toggle" class="icon-btn">&#9681;</button>
      </header>

      <div id="messages" class="messages-container">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">M</div>
          <h1>Marshal</h1>
          <p>Personal AI assistant. Describe a task below.</p>
        </div>
      </div>

      <div class="input-bar">
        <div id="attachments-preview" class="attachments-preview"></div>
        <form id="composer" class="composer-form">
          <button type="button" id="attach-btn" class="icon-btn" title="Attach file">&#128206;</button>
          <input type="file" id="file-input" multiple hidden />
          <textarea id="task-input" rows="1" placeholder="Describe a task..." class="auto-resize"></textarea>
          <button type="submit" id="send-btn" class="send-btn" disabled>
            <span class="send-icon">&uarr;</span>
          </button>
        </form>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
