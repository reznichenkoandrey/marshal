<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" />
  <title>Marshal glow</title>
  <link rel="stylesheet" href="./design-tokens.css" />
  <script src="./theme.js"></script>
  <style>
    /* Glow frame (#285): click-through, excluded from screen share, static —
       a full-display layer animated every frame would cost the compositor. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    .frame {
      --state: var(--state-listen);
      position: fixed;
      inset: 0;
      box-shadow:
        inset 0 0 0 2px color-mix(in srgb, var(--state) 70%, transparent),
        inset 0 0 36px 6px color-mix(in srgb, var(--state) 45%, transparent);
      opacity: 0;
      transition: opacity var(--dur-slow) var(--ease-out), box-shadow var(--dur-slow) var(--ease-out);
    }
    .frame[data-state] { opacity: 1; }
    .frame[data-state="speaking"] { --state: var(--state-speak); }
    @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
  </style>
</head>
<body>
  <div class="frame" id="frame"></div>
  <script type="module" src="./assistant-glow.js"></script>
</body>
</html>
