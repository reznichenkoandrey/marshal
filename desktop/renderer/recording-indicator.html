<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <link rel="stylesheet" href="./design-tokens.css" />
    <script src="./theme.js"></script>
    <script src="./locales.js"></script>
    <script src="./i18n.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: var(--font-sans);
      }
      /* Lumen indicator (#399): hairline card, mono uppercase readouts, the
         state colour only on the marker and the label. */
      .pill {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 0 var(--space-2) 0 var(--space-3);
        border-radius: var(--radius-card, var(--radius-lg));
        border: 1px solid var(--border-hairline, var(--border-default));
        border-left: 2px solid var(--marker);
        background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--shadow-md);
        color: var(--text-strong);
      }
      #label {
        flex: 1;
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        font-weight: var(--fw-medium);
        letter-spacing: var(--label-tracking, var(--letter-wider));
        text-transform: uppercase;
        color: var(--marker);
      }
      #time {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: var(--fs-xs);
        letter-spacing: var(--label-tracking, var(--letter-wider));
        color: var(--text-muted);
      }
      button {
        width: 26px;
        height: 26px;
        border: 1px solid var(--border-hairline, var(--border-default));
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        color: var(--text-default);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      }
      button:hover { background: var(--bg-hover); }
      button:active { transform: scale(0.94); }
      button.stop {
        border-color: transparent;
        background: var(--chip-bad-bg, var(--danger-soft));
      }
      button.stop:hover { background: color-mix(in srgb, var(--state-fail) 28%, transparent); }
      .square { background: var(--state-fail); width: 9px; height: 9px; border-radius: 1px; }
      .pill { --marker: var(--state-fail); }
      #time { flex: 1; color: var(--text-strong); }
      .dot {
        width: 9px;
        height: 9px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--state-fail);
        animation: blink 1s infinite;
      }
      .dot.paused { animation: none; background: var(--state-wait); }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
      .icon { display: inline-block; width: 12px; height: 12px; }
      .icon.pause { border-left: 3px solid currentColor; border-right: 3px solid currentColor; width: 10px; }
      .icon.play { width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
      .icon.square { background: var(--state-fail); width: 9px; height: 9px; border-radius: 1px; }
    </style>
  </head>
  <body>
    <div class="pill">
      <span class="dot" id="dot"></span>
      <span id="time">00:00</span>
      <button id="toggle" title="Pause / Resume" aria-label="Pause / Resume" data-i18n-title="indicator.pauseResume" data-i18n-aria-label="indicator.pauseResume"><span class="icon pause" id="toggle-icon"></span></button>
      <button id="stop" class="stop" title="Stop" aria-label="Stop" data-i18n-title="indicator.stop" data-i18n-aria-label="indicator.stop"><span class="icon square"></span></button>
    </div>
    <script type="module">
      const api = window.marshalCapture;
      const timeEl = document.getElementById("time");
      const dotEl = document.getElementById("dot");
      const toggleBtn = document.getElementById("toggle");
      const toggleIcon = document.getElementById("toggle-icon");
      const stopBtn = document.getElementById("stop");

      let seconds = 0;
      let paused = false;
      let interval = setInterval(() => {
        if (paused) return;
        seconds += 1;
        const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
        const ss = String(seconds % 60).padStart(2, "0");
        timeEl.textContent = `${mm}:${ss}`;
      }, 1000);

      toggleBtn.addEventListener("click", () => {
        paused = !paused;
        dotEl.classList.toggle("paused", paused);
        toggleIcon.className = paused ? "icon play" : "icon pause";
        api.recordingToggle(paused);
      });

      stopBtn.addEventListener("click", () => {
        clearInterval(interval);
        api.recordingStop();
      });

      if (api && typeof api.onRecordingPaused === "function") {
        api.onRecordingPaused((_event, payload) => {
          paused = Boolean(payload && payload.paused);
          dotEl.classList.toggle("paused", paused);
          toggleIcon.className = paused ? "icon play" : "icon pause";
        });
      }
    </script>
  </body>
</html>
