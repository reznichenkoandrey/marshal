<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --accent: #4d9aff;
        --accent-chip-text: #0b0b0d;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", system-ui, sans-serif;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: crosshair;
        background: transparent;
        user-select: none;
        font-family: var(--font-sans);
      }

      /*
       * Initial dark overlay — covers entire screen before user starts dragging.
       * BrowserWindow is transparent:true, so OS content shows through the
       * semi-transparent backdrop (no screenshot capture needed).
       */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.42);
        z-index: 1;
        pointer-events: none;
      }

      /*
       * Selection box:
       *  - transparent background → real screen visible inside
       *  - box-shadow 9999px → dims everything outside the selection
       */
      #selection {
        position: fixed;
        border: 1.5px solid var(--accent);
        background: transparent;
        display: none;
        z-index: 3;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.52);
        border-radius: 2px;
      }

      /* Corner handles */
      .corner {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 2px;
        box-shadow: 0 0 0 2px rgba(11, 11, 13, 0.6);
      }
      .corner-tl { top: -2px; left: -2px; }
      .corner-tr { top: -2px; right: -2px; }
      .corner-bl { bottom: -2px; left: -2px; }
      .corner-br { bottom: -2px; right: -2px; }

      /* "Release to translate" label inside the selection */
      #sel-hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(19, 19, 22, 0.88);
        backdrop-filter: blur(6px);
        color: #f5f5f7;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
        display: none;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Initial center hint */
      #hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        z-index: 4;
        text-align: center;
        line-height: 1.7;
        letter-spacing: -0.01em;
      }

      #hint span {
        display: block;
        font-size: 12px;
        opacity: 0.65;
        margin-top: 4px;
        font-weight: 400;
      }

      /* Size label near cursor */
      #size-label {
        position: fixed;
        background: var(--accent);
        color: var(--accent-chip-text);
        font-size: 10px;
        font-weight: 700;
        font-feature-settings: "tnum";
        padding: 3px 8px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 5;
        display: none;
        letter-spacing: 0.02em;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="overlay"></div>

    <div id="selection">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div id="sel-hint">Release to translate</div>
    </div>

    <div id="hint">
      Drag to select region to translate
      <span>Press Esc to cancel</span>
    </div>
    <div id="size-label"></div>

    <script>
      const api = window.marshalTranslator;
      const sel = document.getElementById("selection");
      const hint = document.getElementById("hint");
      const selHint = document.getElementById("sel-hint");
      const sizeLabel = document.getElementById("size-label");
      const overlay = document.getElementById("overlay");

      let startX = 0, startY = 0, isDragging = false;

      // Channels are assigned per-overlay by the main process and delivered via
      // `crop-init`. Default names are kept as a fallback for older payloads.
      let selectChannel = "marshal:crop-selected";
      let cancelChannel = "marshal:crop-cancelled";

      api.onCropInit((_event, payload) => {
        if (payload && typeof payload === "object" && payload.channels) {
          selectChannel = payload.channels.select ?? selectChannel;
          cancelChannel = payload.channels.cancel ?? cancelChannel;
        }
      });

      document.addEventListener("mousedown", (e) => {
        startX = e.clientX;
        startY = e.clientY;
        isDragging = true;

        overlay.style.display = "none";
        hint.style.display = "none";

        sel.style.display = "block";
        sel.style.left = startX + "px";
        sel.style.top = startY + "px";
        sel.style.width = "0";
        sel.style.height = "0";
        selHint.style.display = "none";
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const x = Math.min(e.clientX, startX);
        const y = Math.min(e.clientY, startY);
        const w = Math.abs(e.clientX - startX);
        const h = Math.abs(e.clientY - startY);

        sel.style.left = x + "px";
        sel.style.top = y + "px";
        sel.style.width = w + "px";
        sel.style.height = h + "px";

        selHint.style.display = (w > 80 && h > 40) ? "block" : "none";

        sizeLabel.style.display = "block";
        sizeLabel.style.left = (e.clientX + 14) + "px";
        sizeLabel.style.top = (e.clientY + 14) + "px";
        sizeLabel.textContent = `${Math.round(w)} × ${Math.round(h)}`;
      });

      document.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        sizeLabel.style.display = "none";

        const x = Math.min(e.clientX, startX);
        const y = Math.min(e.clientY, startY);
        const w = Math.abs(e.clientX - startX);
        const h = Math.abs(e.clientY - startY);

        if (w < 10 || h < 10) {
          api.cancelCrop(cancelChannel);
          return;
        }

        api.selectCrop(
          { x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) },
          selectChannel
        );
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") api.cancelCrop(cancelChannel);
      });
    </script>
  </body>
</html>
