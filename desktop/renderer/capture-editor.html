<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <title data-i18n="capture.windowTitle">Marshal — Capture Editor</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="capture-editor.css" />
    <script src="./theme.js"></script>
    <script src="./locales.js"></script>
    <script src="./i18n.js"></script>
  </head>
  <body>
    <!-- Top toolbar: tools + style pickers -->
    <header class="toolbar" role="toolbar">
      <div class="group">
        <button class="tool" data-tool="crop" title="Crop (C)" aria-label="Crop" data-i18n-title="capture.cropTitle" data-i18n-aria-label="capture.crop">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16a2 2 0 0 0 2 2h16"/><path d="M22 18V8a2 2 0 0 0-2-2H6"/></svg>
        </button>
      </div>

      <div class="sep" aria-hidden="true"></div>

      <div class="group">
        <button class="tool" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle" data-i18n-title="capture.rectTitle" data-i18n-aria-label="capture.rect">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button class="tool" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse" data-i18n-title="capture.ellipseTitle" data-i18n-aria-label="capture.ellipse">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
        </button>
        <button class="tool" data-tool="line" title="Line (L)" aria-label="Line" data-i18n-title="capture.lineTitle" data-i18n-aria-label="capture.line">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20 20 4"/></svg>
        </button>
        <button class="tool" data-tool="arrow" title="Arrow (A)" aria-label="Arrow" data-i18n-title="capture.arrowTitle" data-i18n-aria-label="capture.arrow">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 20 4"/><path d="M13 4h7v7"/></svg>
        </button>
        <button class="tool" data-tool="text" title="Text (T)" aria-label="Text" data-i18n-title="capture.textTitle" data-i18n-aria-label="capture.text">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6V4h16v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
        </button>
        <button class="tool" data-tool="rect-fill" title="Highlight (H)" aria-label="Highlight" data-i18n-title="capture.highlightTitle" data-i18n-aria-label="capture.highlight">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" opacity=".6"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button class="tool" data-tool="counter" title="Counter (N)" aria-label="Counter" data-i18n-title="capture.counterTitle" data-i18n-aria-label="capture.counter">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><text x="12" y="16" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" font-weight="700">1</text></svg>
        </button>
        <button class="tool" data-tool="pen" title="Pen (P)" aria-label="Pen" data-i18n-title="capture.penTitle" data-i18n-aria-label="capture.pen">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5 19 9l-11 11H3.5v-4.5Z"/></svg>
        </button>
        <button class="tool" data-tool="blur" title="Blur (B)" aria-label="Blur" data-i18n-title="capture.blurTitle" data-i18n-aria-label="capture.blur">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="1.5"/><circle cx="12" cy="7" r="1.5"/><circle cx="17" cy="7" r="1.5"/><circle cx="7" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="17" cy="12" r="1.5"/><circle cx="7" cy="17" r="1.5"/><circle cx="12" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg>
        </button>
      </div>

      <div class="sep" aria-hidden="true"></div>

      <div class="group style-pickers">
        <label class="color-swatch" title="Stroke color" data-i18n-title="capture.strokeColor">
          <input type="color" id="stroke-color" value="#e5484d" />
          <span class="color-chip" id="stroke-chip" style="background: #e5484d"></span>
        </label>
        <div class="stroke-width" role="group" aria-label="Stroke width" data-i18n-aria-label="capture.strokeWidth">
          <button data-width="2" class="stroke-w">
            <span class="dot" style="width:6px;height:6px"></span>
          </button>
          <button data-width="4" class="stroke-w active">
            <span class="dot" style="width:10px;height:10px"></span>
          </button>
          <button data-width="8" class="stroke-w">
            <span class="dot" style="width:14px;height:14px"></span>
          </button>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="group">
        <button class="tool" id="undo" title="Undo (⌘Z)" aria-label="Undo" data-i18n-title="capture.undoTitle" data-i18n-aria-label="capture.undo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="tool" id="redo" title="Redo (⌘⇧Z)" aria-label="Redo" data-i18n-title="capture.redoTitle" data-i18n-aria-label="capture.redo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
      </div>

      <button class="primary" id="save-as" title="Save as… (⌘S)" data-i18n-title="capture.saveAsTitle" data-i18n="capture.saveAs">Save as…</button>
    </header>

    <!-- Canvas viewport -->
    <main class="viewport" id="viewport">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="base-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
        <textarea id="text-input" class="text-input hidden" spellcheck="false"></textarea>
      </div>
    </main>

    <!-- Bottom status/action bar -->
    <footer class="statusbar">
      <div class="zoom">
        <button class="ghost" id="zoom-out" title="Zoom out" data-i18n-title="capture.zoomOut">−</button>
        <span id="zoom-label">100%</span>
        <button class="ghost" id="zoom-in" title="Zoom in" data-i18n-title="capture.zoomIn">+</button>
        <button class="ghost" id="zoom-fit" title="Fit to window" data-i18n-title="capture.fitTitle" data-i18n="capture.fit">Fit</button>
      </div>
      <div class="drag-hint">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><circle cx="6" cy="10" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="10" r="1.4"/><circle cx="12" cy="14" r="1.4"/><circle cx="18" cy="10" r="1.4"/><circle cx="18" cy="14" r="1.4"/></svg>
        <span data-i18n="capture.dragMe">Drag me</span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><circle cx="6" cy="10" r="1.4"/><circle cx="6" cy="14" r="1.4"/><circle cx="12" cy="10" r="1.4"/><circle cx="12" cy="14" r="1.4"/><circle cx="18" cy="10" r="1.4"/><circle cx="18" cy="14" r="1.4"/></svg>
      </div>
      <div class="actions">
        <input id="claude-note" type="text" autocomplete="off" spellcheck="false" placeholder="Note for Claude (name a session to pick it)" data-i18n-placeholder="capture.claudeNote">
        <button class="ghost" id="send-to-claude" title="Send to a Claude Code session (Enter in the note)" data-i18n-title="capture.sendToClaudeTitle">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          <span data-i18n="capture.sendToClaude">Send to Claude</span>
        </button>
        <button class="ghost" id="copy" title="Copy to clipboard (⌘C)" data-i18n-title="capture.copyTitle">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
          <span data-i18n="capture.copy">Copy</span>
        </button>
        <button class="ghost" id="stay-on-top" title="Keep above other windows" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14"/><path d="M12 21V7"/><path d="m7 12 5-5 5 5"/></svg>
        </button>
        <button class="ghost" id="pin" title="Pin on screen" data-i18n-title="capture.pin">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 4 6 6-4 1-3 3-5-5 3-3 1-4 2 2Z"/><path d="M9 15 3 21"/></svg>
        </button>
        <button class="ghost" id="save-quick" title="Save to default folder" data-i18n-title="capture.saveQuick">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h14a1 1 0 0 0 1-1V8l-5-5H6a1 1 0 0 0-1 1Z"/><path d="M7 3v6h8V3"/><path d="M7 15h10"/></svg>
        </button>
      </div>
    </footer>

    <!-- Live toast for save/copy feedback -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="capture-editor.js" type="module"></script>
  </body>
</html>
