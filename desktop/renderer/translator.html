<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="translator.windowTitle">Marshal Translator</title>
    <link rel="stylesheet" href="./translator.css" />
    <script src="./theme.js"></script>
    <script src="./locales.js"></script>
    <script src="./i18n.js"></script>
  </head>
  <body>
    <!-- Header: window chrome + global actions -->
    <div class="header">
      <span class="header-title">
        <span data-icon="languages" data-icon-size="14"></span>
        <span data-i18n="translator.title">Translator</span>
      </span>

      <div class="header-right">
        <button class="icon-btn" id="btn-expand" title="Open the full translator" data-i18n-title="translator.expandTitle">
          <span data-icon="maximize-2" data-icon-size="14"></span>
        </button>
        <button class="icon-btn full-only" id="btn-pin" title="Keep window open (⌘P)" aria-pressed="false">
          <span data-icon="pin" data-icon-size="14"></span>
        </button>
        <button class="icon-btn full-only" id="btn-glossary" title="Glossary — terms the translator must not rewrite" data-i18n-title="translator.glossaryTitle">
          <span data-icon="book" data-icon-size="14"></span>
        </button>
        <button class="icon-btn full-only" id="btn-history" title="History (↑/↓ in empty input)" data-i18n-title="translator.historyTitle">
          <span data-icon="rotate-ccw" data-icon-size="14"></span>
        </button>
        <button class="icon-btn full-only" id="btn-capture" title="Capture screen region (⌘⇧2)" data-i18n-title="translator.captureTitle">
          <span data-icon="crop" data-icon-size="14"></span>
        </button>
        <button class="icon-btn full-only" id="btn-upload" title="Upload image" data-i18n-title="translator.uploadTitle">
          <span data-icon="folder-open" data-icon-size="14"></span>
        </button>
        <input type="file" id="file-input" accept="image/*" hidden />
        <button class="icon-btn close" id="close-btn" title="Close (Esc)" data-i18n-title="translator.closeTitle">
          <span data-icon="x" data-icon-size="14"></span>
        </button>
      </div>
    </div>

    <!-- Language bar: source ⇄ target, aligned with the panes below -->
    <div class="lang-bar">
      <button class="lang-select" id="src-lang" aria-haspopup="listbox" aria-expanded="false">
        <span class="lang-select-value" id="src-lang-label">Detect language</span>
        <span class="lang-select-detected" id="src-lang-detected"></span>
        <span data-icon="chevron-down" data-icon-size="12"></span>
      </button>

      <button class="swap-btn" id="btn-swap" title="Swap languages (⌘⇧S)" data-i18n-title="translator.swapTitle">
        <span data-icon="arrow-left-right" data-icon-size="14"></span>
      </button>

      <button class="lang-select" id="tgt-lang" aria-haspopup="listbox" aria-expanded="false">
        <span class="lang-select-value" id="tgt-lang-label">Ukrainian</span>
        <span data-icon="chevron-down" data-icon-size="12"></span>
      </button>

      <button class="formality-btn" id="btn-formality" title="Register of the translation" data-i18n-title="translator.formalityTitle">
        <span id="formality-label">Neutral</span>
      </button>
    </div>

    <!-- Two panes: source on the left, translation on the right -->
    <div class="panes">
      <section class="pane pane-source">
        <textarea
          id="input-text"
          class="input-textarea"
          placeholder="Type or paste text…"
          data-i18n-placeholder="translator.inputPlaceholder"
          spellcheck="false"
        ></textarea>
        <div class="pane-footer">
          <span class="char-count" id="char-count"></span>
          <div class="pane-actions">
            <button class="toolbar-btn" id="btn-paste" title="Paste from clipboard" data-i18n-title="translator.pasteTitle">
              <span data-icon="clipboard" data-icon-size="12"></span>
              <span data-i18n="translator.paste">Paste</span>
            </button>
            <button class="toolbar-btn" id="btn-clear" title="Clear" data-i18n-title="translator.clear">
              <span data-icon="eraser" data-icon-size="12"></span>
              <span data-i18n="translator.clear">Clear</span>
            </button>
          </div>
        </div>
      </section>

      <section class="pane pane-target">
        <div class="result-body">
          <div class="result-text" id="result-text"></div>

          <!-- Alternatives for a clicked word (#146). Anchored to the word
               inside .result-body, which is the positioned ancestor. -->
          <div class="alt-popover" id="alt-popover" hidden role="listbox" aria-label="Alternative translations" data-i18n-aria-label="translator.alternativesLabel"></div>

          <div class="state-overlay" id="state-loading" style="display:none">
            <div class="spinner"></div>
            <span data-i18n="translator.translating">Translating…</span>
          </div>

          <div class="state-overlay" id="state-empty">
            <span data-i18n="translator.emptyState">Start typing to translate</span>
            <span class="state-hint" data-i18n-html="translator.emptyHint">
              <kbd>⌘C</kbd> <kbd>⌘C</kbd> double-copy · <kbd>⌘⌥T</kbd> copied text · <kbd>⌘⇧2</kbd> capture
            </span>
          </div>

          <div class="error-msg" id="error-msg"></div>
          <div class="notice-msg" id="notice-msg" hidden></div>
        </div>
        <div class="pane-footer">
          <span class="lang-badge" id="lang-badge"></span>
          <div class="pane-actions">
            <button class="toolbar-btn" id="btn-insert" title="Paste into the app you came from (⌘⇧V)" data-i18n-title="translator.insertTitle" disabled>
              <span data-icon="corner-down-left" data-icon-size="12"></span>
              <span data-i18n="translator.insert">Insert</span>
            </button>
            <button class="copy-btn" id="copy-btn" disabled>
              <span data-icon="copy" data-icon-size="12"></span>
              <span data-i18n="translator.copy">Copy</span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <!-- Language picker, anchored to whichever selector opened it -->
    <div class="lang-popover" id="lang-popover" role="listbox" hidden>
      <div class="lang-search">
        <span data-icon="search" data-icon-size="12"></span>
        <input type="text" id="lang-filter" placeholder="Search language" data-i18n-placeholder="translator.searchLanguage" spellcheck="false" />
      </div>
      <div class="lang-options" id="lang-options"></div>
    </div>

    <!-- Glossary: terms that must always come out the same way -->
    <div id="glossary-panel" class="history-panel glossary-panel" hidden>
      <div class="history-header">
        <span class="history-title" data-i18n="translator.glossary">Glossary</span>
        <span class="glossary-hint" id="glossary-hint"></span>
      </div>
      <form class="glossary-form" id="glossary-form">
        <input type="text" id="glossary-term" placeholder="Term, e.g. backoff" data-i18n-placeholder="translator.glossaryTermPlaceholder" spellcheck="false" />
        <input type="text" id="glossary-translation" placeholder="Empty = keep as-is" data-i18n-placeholder="translator.glossaryTranslationPlaceholder" spellcheck="false" />
        <button type="submit" class="toolbar-btn" id="glossary-add" data-i18n="translator.add">Add</button>
      </form>
      <div id="glossary-list" class="history-list glossary-list"></div>
    </div>

    <!-- History dropdown -->
    <div id="history-panel" class="history-panel" hidden>
      <div class="history-header">
        <span class="history-title" data-i18n="translator.recentTranslations">Recent translations</span>
        <button class="history-clear" id="history-clear" title="Clear all history" data-i18n-title="translator.clearHistoryTitle" data-i18n="translator.clear">Clear</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

    <script src="./icons.js"></script>
    <script src="./translator.js" type="module"></script>
  </body>
</html>
