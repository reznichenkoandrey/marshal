<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marshal Translator</title>
    <link rel="stylesheet" href="./translator.css" />
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <span class="header-title">
        <span data-icon="languages" data-icon-size="14"></span>
        Translator
      </span>

      <div class="header-center">
        <div class="lang-toggle" role="tablist" aria-label="Target language">
          <button class="lang-btn active" data-lang="uk" role="tab">UK</button>
          <button class="lang-btn" data-lang="en" role="tab">EN</button>
        </div>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="btn-history" title="History (↑/↓ in empty input)">
          <span data-icon="rotate-ccw" data-icon-size="14"></span>
        </button>
        <button class="icon-btn" id="btn-capture" title="Capture screen region (⌘⇧2)">
          <span data-icon="crop" data-icon-size="14"></span>
        </button>
        <button class="icon-btn" id="btn-upload" title="Upload image">
          <span data-icon="folder-open" data-icon-size="14"></span>
        </button>
        <input type="file" id="file-input" accept="image/*" hidden />
        <button class="icon-btn close" id="close-btn" title="Close (Esc)">
          <span data-icon="x" data-icon-size="14"></span>
        </button>
      </div>
    </div>

    <!-- History dropdown -->
    <div id="history-panel" class="history-panel" style="display:none">
      <div class="history-header">
        <span class="history-title">Recent translations</span>
        <button class="history-clear" id="history-clear" title="Clear all history">Clear</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

    <!-- Input area -->
    <div class="input-section">
      <textarea
        id="input-text"
        class="input-textarea"
        placeholder="Type or paste text…  ⌘↵ to translate"
        spellcheck="false"
      ></textarea>
      <div class="input-toolbar">
        <div class="toolbar-left">
          <button class="toolbar-btn" id="btn-paste" title="Paste from clipboard">
            <span data-icon="clipboard" data-icon-size="12"></span>
            Paste
          </button>
          <button class="toolbar-btn" id="btn-clear" title="Clear">
            <span data-icon="eraser" data-icon-size="12"></span>
            Clear
          </button>
        </div>
        <button class="translate-btn" id="btn-translate" disabled>
          <span data-icon="arrow-down" data-icon-size="12"></span>
          Translate
        </button>
      </div>
    </div>

    <!-- Result area -->
    <div class="result-section">
      <div class="result-label" id="result-label">Translation</div>
      <div class="result-text" id="result-text"></div>

      <div class="state-overlay" id="state-loading" style="display:none">
        <div class="spinner"></div>
        <span>Translating…</span>
      </div>

      <div class="state-overlay" id="state-empty" style="display:flex">
        <span>Enter text or capture a screen region</span>
        <span class="state-hint">
          <kbd>⌘C</kbd> <kbd>⌘C</kbd> double-copy · <kbd>⌘⇧T</kbd> copied text · <kbd>⌘⇧2</kbd> capture
        </span>
      </div>

      <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="lang-badge" id="lang-badge"></span>
      <button class="copy-btn" id="copy-btn">
        <span data-icon="copy" data-icon-size="12"></span>
        Copy
      </button>
    </div>

    <script src="./icons.js"></script>
    <script src="./translator.js"></script>
  </body>
</html>
