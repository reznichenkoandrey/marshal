<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <title>Convert to GIF</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg-app);
        color: var(--text-default);
        font-family: var(--font-sans);
        font-size: var(--fs-base);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        -webkit-app-region: drag;
        height: 36px;
        padding: 0 16px 0 80px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border-subtle);
      }
      header h1 {
        font-size: var(--fs-sm);
        font-weight: var(--fw-medium);
        color: var(--text-default);
        letter-spacing: 0.01em;
      }
      main {
        flex: 1;
        padding: 18px 22px 10px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .file {
        padding: 10px 12px;
        background: var(--bg-muted);
        border-radius: var(--radius-md);
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-muted);
        word-break: break-all;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row {
        display: grid;
        grid-template-columns: 88px 1fr;
        align-items: center;
        gap: 14px;
      }
      .row label { color: var(--text-muted); }
      select {
        width: 100%;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--text-default);
        font-family: inherit;
        font-size: var(--fs-sm);
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-default);
      }
      .check input { accent-color: var(--accent); }
      .progress {
        width: 100%;
        height: 6px;
        background: var(--bg-muted);
        border-radius: var(--radius-pill);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 180ms var(--ease-out);
      }
      #status {
        font-size: var(--fs-xs);
        color: var(--text-muted);
        min-height: 16px;
      }
      #status.error { color: var(--danger-text); }
      #status.success { color: var(--success-text); }
      footer {
        padding: 12px 22px 16px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--border-subtle);
      }
      button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: var(--radius-sm);
        font: var(--fw-medium) var(--fs-sm) var(--font-sans);
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: var(--text-on-accent);
      }
      .primary:hover { background: var(--accent-hover); }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .ghost {
        background: transparent;
        color: var(--text-default);
      }
      .ghost:hover { background: var(--bg-hover); }
    </style>
  </head>
  <body>
    <header><h1>Convert video to GIF</h1></header>
    <main>
      <div class="file" id="file-path">—</div>

      <div class="row">
        <label for="fps">FPS</label>
        <select id="fps">
          <option value="10">10 — small</option>
          <option value="15" selected>15 — default</option>
          <option value="24">24 — smooth</option>
          <option value="30">30 — max</option>
        </select>
      </div>

      <div class="row">
        <label for="width">Width</label>
        <select id="width">
          <option value="480">480 px</option>
          <option value="720" selected>720 px</option>
          <option value="960">960 px</option>
          <option value="1280">1280 px</option>
          <option value="0">Original</option>
        </select>
      </div>

      <div class="row">
        <span></span>
        <label class="check">
          <input type="checkbox" id="loop" checked />
          Loop forever
        </label>
      </div>

      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <div id="status">Ready.</div>
    </main>
    <footer>
      <button class="ghost" id="cancel">Close</button>
      <button class="primary" id="export">Export GIF</button>
    </footer>
    <script type="module">
      const api = window.marshalCapture;
      const fileEl = document.getElementById("file-path");
      const fpsEl = document.getElementById("fps");
      const widthEl = document.getElementById("width");
      const loopEl = document.getElementById("loop");
      const progressEl = document.getElementById("progress-bar");
      const statusEl = document.getElementById("status");
      const exportBtn = document.getElementById("export");
      const cancelBtn = document.getElementById("cancel");

      let inputPath = "";

      api.onGifInit((_event, payload) => {
        inputPath = payload.inputPath || "";
        fileEl.textContent = inputPath || "No file selected";
      });

      api.onGifProgress((_event, payload) => {
        const pct = Math.round((payload.progress || 0) * 100);
        progressEl.style.width = `${pct}%`;
        statusEl.textContent = `Encoding… ${pct}%`;
        statusEl.className = "";
      });

      api.onGifDone((_event, payload) => {
        progressEl.style.width = "100%";
        statusEl.textContent = `Saved: ${payload.outputPath}`;
        statusEl.className = "success";
        exportBtn.disabled = false;
        exportBtn.textContent = "Export GIF";
      });

      api.onGifError((_event, payload) => {
        statusEl.textContent = payload.message || "Failed";
        statusEl.className = "error";
        exportBtn.disabled = false;
        exportBtn.textContent = "Export GIF";
      });

      exportBtn.addEventListener("click", async () => {
        if (!inputPath) {
          statusEl.textContent = "Pick a video first.";
          statusEl.className = "error";
          return;
        }
        exportBtn.disabled = true;
        exportBtn.textContent = "Working…";
        statusEl.textContent = "Starting encode…";
        statusEl.className = "";
        progressEl.style.width = "0%";
        try {
          await api.gifStart({
            inputPath,
            fps: Number(fpsEl.value),
            width: Number(widthEl.value),
            loop: loopEl.checked
          });
        } catch (err) {
          statusEl.textContent = err && err.message ? err.message : String(err);
          statusEl.className = "error";
          exportBtn.disabled = false;
          exportBtn.textContent = "Export GIF";
        }
      });

      cancelBtn.addEventListener("click", () => api.gifClose());
    </script>
  </body>
</html>
