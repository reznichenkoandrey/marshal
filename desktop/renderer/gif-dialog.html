<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'" />
    <title data-i18n="gif.windowTitle">Convert to GIF</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg-app);
        color: var(--text-default);
        font-family: var(--font-sans);
        font-size: var(--fs-base);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        -webkit-app-region: drag;
        height: 36px;
        padding: 0 16px 0 80px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border-hairline, var(--border-default));
      }
      header h1 {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        font-weight: var(--fw-medium);
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: var(--label-tracking, var(--letter-wider));
      }
      main {
        flex: 1;
        padding: 18px 22px 10px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .file {
        padding: 10px 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-hairline, var(--border-default));
        border-radius: var(--radius-card, var(--radius-md));
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-muted);
        word-break: break-all;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row {
        display: grid;
        grid-template-columns: 88px 1fr;
        align-items: center;
        gap: 14px;
      }
      .row label:not(.check) {
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        text-transform: uppercase;
        letter-spacing: var(--label-tracking, var(--letter-wider));
      }
      select {
        width: 100%;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--border-hairline, var(--border-default));
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        color: var(--text-default);
        font-family: inherit;
        font-size: var(--fs-sm);
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-default);
      }
      .check input { accent-color: var(--accent); }
      .progress {
        width: 100%;
        height: 4px;
        background: var(--bg-muted);
        border-radius: var(--radius-xs);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 180ms var(--ease-out);
      }
      #status {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-muted);
        min-height: 16px;
      }
      #status.error { color: var(--danger-text); }
      #status.success { color: var(--success-text); }
      footer {
        padding: 12px 22px 16px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--border-hairline, var(--border-default));
      }
      button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: var(--radius-sm);
        font: var(--fw-medium) var(--fs-sm) var(--font-sans);
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: var(--text-on-accent);
      }
      .primary:hover { background: var(--accent-hover); }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .ghost {
        background: var(--bg-elevated);
        border: 1px solid var(--border-hairline, var(--border-default));
        color: var(--text-default);
      }
      .ghost:hover { background: var(--bg-hover); }
    </style>
    <script src="./theme.js"></script>
    <script src="./locales.js"></script>
    <script src="./i18n.js"></script>
  </head>
  <body>
    <header><h1 data-i18n="gif.heading">Convert video to GIF</h1></header>
    <main>
      <div class="file" id="file-path">—</div>

      <div class="row">
        <label for="fps">FPS</label>
        <select id="fps">
          <option value="10" data-i18n="gif.fpsSmall">10 — small</option>
          <option value="15" selected data-i18n="gif.fpsDefault">15 — default</option>
          <option value="24" data-i18n="gif.fpsSmooth">24 — smooth</option>
          <option value="30" data-i18n="gif.fpsMax">30 — max</option>
        </select>
      </div>

      <div class="row">
        <label for="width" data-i18n="gif.width">Width</label>
        <select id="width">
          <option value="480">480 px</option>
          <option value="720" selected>720 px</option>
          <option value="960">960 px</option>
          <option value="1280">1280 px</option>
          <option value="0" data-i18n="gif.original">Original</option>
        </select>
      </div>

      <div class="row">
        <span></span>
        <label class="check">
          <input type="checkbox" id="loop" checked />
          <span data-i18n="gif.loop">Loop forever</span>
        </label>
      </div>

      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <div id="status" data-i18n="gif.ready">Ready.</div>
    </main>
    <footer>
      <button class="ghost" id="cancel" data-i18n="gif.close">Close</button>
      <button class="primary" id="export" data-i18n="gif.export">Export GIF</button>
    </footer>
    <script type="module">
      const api = window.marshalCapture;
      const t = (key, params) => window.MarshalI18n?.t(key, params) ?? key;
      const fileEl = document.getElementById("file-path");
      const fpsEl = document.getElementById("fps");
      const widthEl = document.getElementById("width");
      const loopEl = document.getElementById("loop");
      const progressEl = document.getElementById("progress-bar");
      const statusEl = document.getElementById("status");
      const exportBtn = document.getElementById("export");
      const cancelBtn = document.getElementById("cancel");

      // null until main sends gif-init; the file row keeps its "—" placeholder.
      let inputPath = null;
      let busy = false;
      // Status is either a catalog key with params or raw error text, so a
      // language switch can re-render it.
      let status = { key: "gif.ready", className: "" };

      function render() {
        if (inputPath !== null) fileEl.textContent = inputPath || t("gif.noFile");
        statusEl.textContent = status.raw ?? t(status.key, status.params);
        statusEl.className = status.className;
        exportBtn.disabled = busy;
        exportBtn.textContent = t(busy ? "gif.working" : "gif.export");
      }

      function setStatus(next, isBusy = busy) {
        status = { className: "", ...next };
        busy = isBusy;
        render();
      }

      window.addEventListener("marshal:language", render);

      api.onGifInit((_event, payload) => {
        inputPath = payload.inputPath || "";
        render();
      });

      api.onGifProgress((_event, payload) => {
        const pct = Math.round((payload.progress || 0) * 100);
        progressEl.style.width = `${pct}%`;
        setStatus({ key: "gif.encoding", params: { pct } });
      });

      api.onGifDone((_event, payload) => {
        progressEl.style.width = "100%";
        setStatus({ key: "gif.saved", params: { path: payload.outputPath }, className: "success" }, false);
      });

      api.onGifError((_event, payload) => {
        setStatus(payload.message ? { raw: payload.message, className: "error" } : { key: "gif.failed", className: "error" }, false);
      });

      exportBtn.addEventListener("click", async () => {
        if (!inputPath) {
          setStatus({ key: "gif.pickVideo", className: "error" });
          return;
        }
        setStatus({ key: "gif.starting" }, true);
        progressEl.style.width = "0%";
        try {
          await api.gifStart({
            inputPath,
            fps: Number(fpsEl.value),
            width: Number(widthEl.value),
            loop: loopEl.checked
          });
        } catch (err) {
          setStatus({ raw: err && err.message ? err.message : String(err), className: "error" }, false);
        }
      });

      cancelBtn.addEventListener("click", () => api.gifClose());
    </script>
  </body>
</html>
