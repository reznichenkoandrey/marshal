<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marshal</title>
  <link rel="stylesheet" href="./design-tokens.css" />
  <link rel="stylesheet" href="./assistant-home.css" />
  <script src="./theme.js"></script>
  <script src="./icons.js"></script>
</head>
<body>
  <div class="home" id="home" data-state="idle">
    <div class="scan" aria-hidden="true"></div>
    <header class="bar">
      <span class="brand">Marshal</span>
      <span class="chip" id="state-chip" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <kbd class="hotkey" id="hotkey" hidden></kbd>
      <button class="icon-btn" id="close-btn" type="button" data-icon="x" data-icon-size="16"></button>
    </header>

    <div class="strip" id="strip">
      <div class="keys">
        <span class="key" data-key="dictation">dict</span>
        <span class="key" data-key="captions">capt</span>
        <span class="key" data-key="translator">trns</span>
        <span class="key" data-key="recording">rec</span>
      </div>
      <div class="toggles">
        <button type="button" class="tog" data-action="toggle-speech"><span class="sw" aria-hidden="true"></span><span data-label="speech"></span></button>
        <button type="button" class="tog" data-action="toggle-badge"><span class="sw" aria-hidden="true"></span><span data-label="badge"></span></button>
        <button type="button" class="tog lang" data-action="toggle-language"></button>
      </div>
      <div class="mem" id="mem" hidden><span class="batt" id="batt" aria-hidden="true"></span><span id="mem-text"></span></div>
      <div class="meeting" id="meeting" hidden>
        <span class="meeting-text"><b id="meeting-title"></b> <span id="meeting-when"></span></span>
        <button type="button" class="join" id="join" data-action="join-meeting"></button>
      </div>
    </div>

    <section class="core">
    <main class="stage">
      <canvas id="visual" class="visual" aria-hidden="true"></canvas>
    </main>

    <p class="line" id="assistant-line" aria-live="polite"></p>

    <nav class="dock" aria-label="Dock">
      <button type="button" data-action="translator" data-icon="languages"></button>
      <button type="button" data-action="captions" data-icon="captions"></button>
      <button type="button" data-action="record-call" data-icon="circle-dot"></button>
      <button type="button" class="mic" id="mic-btn" data-action="dictate-session" data-icon="mic" data-icon-size="26"></button>
      <button type="button" data-action="recordings" data-icon="history"></button>
      <button type="button" data-action="capture" data-icon="crop"></button>
      <button type="button" data-action="agent" data-icon="message-square"></button>
      <button type="button" data-action="settings" data-icon="settings"></button>
    </nav>
    </section>

    <aside class="side">
      <section class="card">
        <h3 id="sessions-title"></h3>
        <ul class="sessions" id="sessions" aria-labelledby="sessions-title"></ul>
        <p class="empty" id="sessions-empty"></p>
      </section>
      <section class="card">
        <h3 id="recent-title"></h3>
        <ol class="recent" id="recent" aria-labelledby="recent-title"></ol>
      </section>
    </aside>
  </div>

  <script src="./assistant-home.js" type="module"></script>
</body>
</html>
