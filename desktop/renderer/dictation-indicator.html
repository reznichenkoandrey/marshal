<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" />
    <link rel="stylesheet" href="./design-tokens.css" />
    <script src="./theme.js"></script>
    <style>
      /* Dictation indicator in the assistant's visual language (#285): tokens
         only, the listening colour, the label font of the active look. */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: var(--font-sans);
      }
      .pill {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 0 var(--space-2) 0 var(--space-3);
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--state-listen) 55%, transparent);
        background: color-mix(in srgb, var(--bg-app) 92%, transparent);
        box-shadow: inset 0 0 18px color-mix(in srgb, var(--state-listen) 18%, transparent);
        color: var(--text-strong);
      }
      .ring {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 2px solid var(--state-listen);
        background: radial-gradient(circle, var(--state-listen) 0 35%, transparent 40%);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.85); }
      }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
      #label {
        flex: 1;
        font-family: var(--font-label);
        font-size: var(--fs-xs);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--state-listen);
      }
      #time {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: var(--fs-xs);
        color: var(--text-muted);
      }
      button.stop {
        width: 28px;
        height: 28px;
        border: 1px solid color-mix(in srgb, var(--state-fail) 45%, transparent);
        border-radius: 50%;
        background: color-mix(in srgb, var(--state-fail) 18%, transparent);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      }
      button.stop:hover { background: color-mix(in srgb, var(--state-fail) 35%, transparent); }
      button.stop:active { transform: scale(0.94); }
      .square { background: var(--state-fail); width: 10px; height: 10px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="pill">
      <span class="ring" aria-hidden="true"></span>
      <span id="label">Listening</span>
      <span id="time">00:00</span>
      <button class="stop" id="stop" title="Stop dictation"><span class="square"></span></button>
    </div>
    <script type="module">
      const api = window.marshalDictation;
      const timeEl = document.getElementById("time");
      const stopBtn = document.getElementById("stop");

      let seconds = 0;
      const interval = setInterval(() => {
        seconds += 1;
        const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
        const ss = String(seconds % 60).padStart(2, "0");
        timeEl.textContent = `${mm}:${ss}`;
      }, 1000);

      stopBtn.addEventListener("click", () => {
        clearInterval(interval);
        if (api && typeof api.stop === "function") {
          api.stop();
        }
      });
    </script>
  </body>
</html>
