<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: -apple-system, "SF Pro Text", Inter, sans-serif;
      }
      .pill {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 0 14px;
        background: rgba(19, 19, 22, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #fff;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }
      .mic {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        color: #e5484d;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.88); }
      }
      #label {
        flex: 1;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      #time {
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      button.stop {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 14px;
        background: rgba(229, 72, 77, 0.25);
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease-out, transform 0.1s ease-out;
      }
      button.stop:hover { background: rgba(229, 72, 77, 0.45); }
      button.stop:active { transform: scale(0.94); }
      .square { background: #fff; width: 10px; height: 10px; border-radius: 1px; }
    </style>
  </head>
  <body>
    <div class="pill">
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <line x1="12" y1="19" x2="12" y2="23" />
        <line x1="8" y1="23" x2="16" y2="23" />
      </svg>
      <span id="label">Listening…</span>
      <span id="time">00:00</span>
      <button class="stop" id="stop" title="Stop dictation"><span class="square"></span></button>
    </div>
    <script type="module">
      const api = window.marshalDictation;
      const timeEl = document.getElementById("time");
      const stopBtn = document.getElementById("stop");

      let seconds = 0;
      const interval = setInterval(() => {
        seconds += 1;
        const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
        const ss = String(seconds % 60).padStart(2, "0");
        timeEl.textContent = `${mm}:${ss}`;
      }, 1000);

      stopBtn.addEventListener("click", () => {
        clearInterval(interval);
        if (api && typeof api.stop === "function") {
          api.stop();
        }
      });
    </script>
  </body>
</html>
